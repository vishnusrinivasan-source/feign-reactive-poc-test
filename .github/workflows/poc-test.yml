name: PoC Test - Pipeline Poisoning
on:
  pull_request_target:
    branches: [main]

jobs:
  test-exposure:
    runs-on: ubuntu-latest
    steps:
      - name: Show token exposure
        run: |
          echo "=============================================="
          echo "VULNERABILITY TEST: pull_request_target + secrets"
          echo "=============================================="
          echo ""
          echo "This workflow ran because of pull_request_target trigger."
          echo "The workflow has access to GITHUB_TOKEN."
          echo ""
          echo "Token value (truncated): ${{ secrets.GITHUB_TOKEN }}"
          echo ""
          echo "=============================================="
